  <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "WebSite",
      "name": "El Mapa de las Historias de La Plata",
      "alternateName": "Mapa de las Historias de La Plata",

      "description": "Historias, personas, lugares y misterios de ayer y de hoy de la ciudad de La Plata.",

        "@type": "Organization",
        "name": "El Mapa de las Historias de La Plata",

  <script>
    // Migración única: las primeras versiones publicadas en Hostinger podían
    // conservar un service worker que todavía consultaba /api/stories. Se
    // eliminan ese worker y sus cachés una sola vez antes de cargar Flutter.
    (() => {
      const currentUrl = new URL(window.location.href);
      if (currentUrl.searchParams.has('cacheMigration')) {
        currentUrl.searchParams.delete('cacheMigration');
        window.history.replaceState(
          window.history.state,
          '',
          `${currentUrl.pathname}${currentUrl.search}${currentUrl.hash}`,
        );
      }

      const migrationKey = 'mhdlp-auth-consent-v1';
      if (localStorage.getItem(migrationKey) === 'done') return;
      localStorage.setItem(migrationKey, 'done');

      const clearWorkers = 'serviceWorker' in navigator
        ? navigator.serviceWorker.getRegistrations().then((registrations) =>
            Promise.all(registrations.map((registration) => registration.unregister())))
        : Promise.resolve();
      const clearCaches = 'caches' in window
        ? caches.keys().then((keys) => Promise.all(keys.map((key) => caches.delete(key))))
        : Promise.resolve();

      Promise.all([clearWorkers, clearCaches]).then(() => {
        window.location.reload();
      });
    })();
  </script>
  <script src="site-measurement.js"></script>
  <script src="install.js"></script>
  <!-- Carga síncrona requerida por google_maps_flutter_web. Esta clave web
